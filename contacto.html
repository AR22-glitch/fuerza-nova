
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport Style | Contacto</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">
        <a href="index.html" class="logo">SPORT<span>STYLE</span></a>

        <button class="menu-toggle" id="menu-toggle"
                aria-label="Abrir menú"
                aria-expanded="false">
            ☰
        </button>

        <nav class="menu" id="menu">
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="servicios.html">Servicios</a>
            <a href="contacto.html">Contacto</a>
            <a href="carrito.html">Mi carrito</a>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <section class="contacto">

            <header class="titulo-contacto">
                <p>ESTAMOS PARA AYUDARTE</p>
                <h1>CONTÁCTANOS</h1>
                <p>Envíanos tus dudas o comentarios.</p>
            </header>

            <!-- FORMULARIO -->
            <form class="formulario"
                  id="formulario-contacto"
                  novalidate>

                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text"
                           id="nombre"
                           name="nombre"
                           placeholder="Escribe tu nombre">
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email"
                           id="correo"
                           name="correo"
                           placeholder="ejemplo@correo.com">
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel"
                           id="telefono"
                           name="telefono"
                           placeholder="10 dígitos"
                           maxlength="10"
                           inputmode="numeric">
                </div>

                <div class="campo">
                    <label for="asunto">Motivo de contacto</label>
                    <select id="asunto" name="asunto">
                        <option value="">Selecciona una opción</option>
                        <option value="productos">Información de productos</option>
                        <option value="compras">Compras</option>
                        <option value="servicios">Servicios</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div class="campo campo-mensaje">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje"
                              name="mensaje"
                              rows="5"
                              placeholder="Escribe tu mensaje aquí..."></textarea>
                </div>

                <div class="campo campo-boton">
                    <button type="submit" class="boton">
                        ENVIAR MENSAJE
                    </button>
                </div>

            </form>

        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="pie-pagina">
        <p>© 2026 Sport Style. Todos los derechos reservados.</p>
        <p>Tu pasión, nuestro compromiso.</p>
    </footer>

    <script src="main.js"></script>

</body>
</html>
